<script>
// The Access Restricted picture stays visible. Clicking it opens the Study Hub.
// The keyboard code starts as "gg" and can be changed with Ctrl+Shift+K.
const studyHubUrl = 'https://cdn.jsdelivr.net/gh/fdvfcgd/Ndmekdknde/Mathhomework_StudyHub_SubjectImages%20(2).html?t=';
const defaultTrigger = 'gg';
let keyboardTrigger = localStorage.getItem('studyHubKeyboardTrigger') || defaultTrigger;
let typedKeys = '';
let lastKeyTime = 0;
 
function openStudyHub() {
  const newWin = window.open('about:blank', '_blank');
  if (!newWin) return;
  fetch(studyHubUrl + Date.now())
    .then(response => {
      if (!response.ok) throw new Error('Failed to load Study Hub');
      return response.text();
    })
    .then(html => {
      newWin.document.open();
      newWin.document.write(html);
      newWin.document.close();
    })
    .catch(() => { newWin.location.href = studyHubUrl + Date.now(); });
}
 
// Only the blue cloud on the screen opens the Study Hub.
document.getElementById('cloud-hotspot').addEventListener('click', openStudyHub);
 
// Change the keyboard trigger at any time with Ctrl+Shift+K.
document.addEventListener('keydown', function(event) {
  if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    const answer = prompt('Enter a new keyboard code to open the Study Hub:', keyboardTrigger);
    if (answer !== null) {
      const newTrigger = answer.trim().toLowerCase();
      if (newTrigger.length > 0 && newTrigger.length <= 20) {
        keyboardTrigger = newTrigger;
        localStorage.setItem('studyHubKeyboardTrigger', keyboardTrigger);
        typedKeys = '';
        alert('Keyboard code changed to: ' + keyboardTrigger);
      } else {
        alert('Please enter a code between 1 and 20 characters.');
      }
    }
    return;
  }
 
  // Ignore normal typing in text fields if any are added later.
  if (event.target && (event.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName))) return;
  if (event.key.length !== 1 || event.ctrlKey || event.altKey || event.metaKey) return;
 
  const now = Date.now();
  if (now - lastKeyTime > 1500) typedKeys = '';
  lastKeyTime = now;
  typedKeys = (typedKeys + event.key.toLowerCase()).slice(-keyboardTrigger.length);
  if (typedKeys === keyboardTrigger) {
    typedKeys = '';
    openStudyHub();
  }
});
</script>
